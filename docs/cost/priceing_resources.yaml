created_at: "2026-06-03T11:10:19Z"

metadata:
  document_name: "pricing resources for planned Dify Azure infrastructure"
  description: "リポジトリで計画・実装されている Azure インフラについて、価格見積もり時に確認すべきリソースをカテゴリ単位で整理する。"
  scope:
    primary_sources:
      - "infra/main.bicep"
      - "infra/modules/*.bicep"
      - "infra/modules/aca-env/*.bicep"
      - "docs/spec/*.md"
    note: "実際の単価、数量計算、利用量の計算ロジックは本ファイルに記載しない。SKU と unit は価格表・見積ツールで確認するための観点として記載する。"
  field_notes:
    sku: "Bicep 実装または仕様で確認できる SKU。未実装・保留リソースは候補または未確定として記載する。"
    unit: "見積時に価格表へ入力・確認する課金単位の観点。単価や数量計算式は含めない。"
  cost_phases:
    initial: "環境作成・初期設定・初回データ投入・証明書登録など、デプロイ開始時または導入時に発生し得る作業・リソース観点。"
    running: "稼働後に継続して発生し得る Azure リソース利用、保存容量、ログ、バックアップ、ネットワーク接続などの観点。"

initial:
  deployment_and_resource_group:
    description: "サブスクリプションスコープでリソースグループを作成し、Bicep モジュール群を展開するための初期構成。"
    resources:
      - name: "Resource Group"
        azure_resource_type: "Microsoft.Resources/resourceGroups"
        sku: "not_applicable"
        unit: "management_scope"
        cost_description: "リソースグループ自体は管理単位だが、配下リソースの課金整理、タグ付け、環境分離の前提となる。"
      - name: "Bicep deployment operations"
        azure_resource_type: "Microsoft.Resources/deployments"
        sku: "not_applicable"
        unit: "deployment_operation"
        cost_description: "デプロイ操作そのものを見積もり対象の主費用とはしないが、初期構築作業と検証工数の整理対象とする。"

  network:
    description: "閉域接続とサブネット分離を構成するためのネットワーク初期リソース。"
    resources:
      - name: "Virtual Network"
        azure_resource_type: "Microsoft.Network/virtualNetworks"
        sku: "not_applicable"
        unit: "network_resource"
        cost_description: "VNet は各 PaaS/Container Apps の接続基盤であり、閉域構成の前提となる。"
      - name: "Subnets"
        azure_resource_type: "Microsoft.Network/virtualNetworks/subnets"
        sku: "not_applicable"
        unit: "subnet"
        cost_description: "Private Link、Container Apps、PostgreSQL など用途別のアドレス空間を確保する。"
      - name: "Private DNS Zones and VNet links"
        azure_resource_type: "Microsoft.Network/privateDnsZones"
        sku: "not_applicable"
        unit: "zone_and_query"
        cost_description: "Private Endpoint や委任サブネット経由の名前解決を初期構築するための DNS 管理リソース。"
      - name: "Private Endpoints"
        azure_resource_type: "Microsoft.Network/privateEndpoints"
        sku: "not_applicable"
        unit: "endpoint_hour_and_data_processed"
        cost_description: "Storage、Key Vault、Redis などを閉域接続するための接続点として作成する。"
      - name: "Network Security Groups"
        azure_resource_type: "Microsoft.Network/networkSecurityGroups"
        sku: "not_applicable"
        unit: "security_rule_set"
        status: "planned_or_module_available"
        cost_description: "仕様上はサブネット境界制御に利用する想定。現行のメイン構成での関連付け有無はデプロイ前に確認する。"

  compute_and_application_platform:
    description: "Dify 実行環境を配置する Azure Container Apps 基盤の初期構築。"
    resources:
      - name: "Container Apps Managed Environment"
        azure_resource_type: "Microsoft.App/managedEnvironments"
        sku: "Consumption workload profile / not explicitly specified"
        unit: "managed_environment"
        cost_description: "Container Apps を VNet 統合・internal 環境で稼働させるための共通基盤。"
      - name: "Container Apps"
        azure_resource_type: "Microsoft.App/containerApps"
        sku: "Consumption / replica resources per component"
        unit: "vCPU_second_and_GiB_second"
        components:
          - name: "nginx"
            cpu: "0.5"
            memory: "1Gi"
          - name: "web"
            cpu: "1"
            memory: "2Gi"
          - name: "api"
            cpu: "2"
            memory: "4Gi"
          - name: "worker"
            cpu: "2"
            memory: "4Gi"
          - name: "sandbox"
            cpu: "0.5"
            memory: "1Gi"
          - name: "plugin"
            cpu: "2"
            memory: "4Gi"
          - name: "ssrfproxy"
            cpu: "0.5"
            memory: "1Gi"
        scale_summary: "minReplicas=acaAppMinCount / maxReplicas=10"
        cost_description: "Dify のアプリケーション実行単位。初期デプロイ時にコンテナ、Ingress、スケール設定、環境変数、ボリュームマウントを構成する。"
      - name: "Container Apps environment storages"
        azure_resource_type: "Microsoft.App/managedEnvironments/storages"
        sku: "Azure Files backed"
        unit: "storage_mount_registration"
        cost_description: "Azure Files を Container Apps にマウントするための環境側登録。保存容量の主費用は Storage 側で管理する。"
      - name: "Container Apps certificate"
        azure_resource_type: "Microsoft.App/managedEnvironments/certificates"
        sku: "provided_certificate"
        unit: "certificate"
        condition: "isProvidedCert=true"
        cost_description: "カスタムドメイン用証明書を ACA Environment に登録する初期設定。証明書の取得・更新費用は利用方式に応じて別管理とする。"

  data_and_storage:
    description: "Dify の永続データ、ファイル、キャッシュを保持する初期リソース。"
    resources:
      - name: "Azure Database for PostgreSQL Flexible Server"
        azure_resource_type: "Microsoft.DBforPostgreSQL/flexibleServers"
        sku: "Burstable Standard_B1ms"
        unit: "server_hour_storage_GB_backup_GB"
        configuration_summary: "PostgreSQL 14 / 32GB storage / 7-day backup / HA disabled"
        cost_description: "Dify DB とベクトル DB の基盤。初期作成時にサーバー、管理ユーザー、ストレージ、バックアップ設定を構成する。"
      - name: "PostgreSQL databases and extensions"
        azure_resource_type: "Microsoft.DBforPostgreSQL/flexibleServers/databases"
        sku: "included_in_flexible_server"
        unit: "database_object"
        components:
          - "dify"
          - "vector"
          - "uuid-ossp/vector extensions"
        cost_description: "アプリケーションデータと pgvector 用 DB を作成する。費用は主に PostgreSQL サーバー側のコンピュート、ストレージ、バックアップに含めて整理する。"
      - name: "Azure Cache for Redis"
        azure_resource_type: "Microsoft.Cache/Redis"
        sku: "Basic C0"
        unit: "cache_instance_hour"
        condition: "isAcaEnabled=true"
        configuration_summary: "Redis 6 / TLS 1.2 / public network disabled"
        cost_description: "キャッシュ、セッション、Celery broker 用の Redis を初期作成する。"
      - name: "Storage Account"
        azure_resource_type: "Microsoft.Storage/storageAccounts"
        sku: "Standard_LRS"
        unit: "GB_month_transaction_data_transfer"
        configuration_summary: "StorageV2 / Hot / public network disabled"
        cost_description: "Blob と Azure Files の共通ストレージ基盤。ファイル保存、設定マウント、プラグイン保存領域の前提となる。"
      - name: "Blob container"
        azure_resource_type: "Microsoft.Storage/storageAccounts/blobServices/containers"
        sku: "Hot / Standard_LRS inherited"
        unit: "GB_month_and_operation"
        cost_description: "Dify のファイル保存先として利用する Blob コンテナーを初期作成する。"
      - name: "Azure Files shares"
        azure_resource_type: "Microsoft.Storage/storageAccounts/fileServices/shares"
        sku: "Standard_LRS inherited"
        unit: "provisioned_or_used_GB_and_operation"
        share_quota: "50GiB per share"
        components:
          - "nginx"
          - "sandbox"
          - "ssrfproxy"
          - "pluginstorage"
        cost_description: "Container Apps にマウントする設定ファイルやプラグイン関連データの共有領域を作成する。"

  security_and_secret_management:
    description: "機密情報管理と閉域アクセスを構成する初期リソース。"
    resources:
      - name: "Key Vault"
        azure_resource_type: "Microsoft.KeyVault/vaults"
        sku: "Standard"
        unit: "operation_secret_certificate"
        configuration_summary: "access policy mode / public network disabled / soft delete enabled"
        cost_description: "PostgreSQL パスワード、証明書、将来的な Azure OpenAI API Key などの機密情報を管理するための初期リソース。"
      - name: "Key Vault access policies"
        azure_resource_type: "Microsoft.KeyVault/vaults/accessPolicies"
        sku: "not_applicable"
        unit: "access_policy"
        cost_description: "データプレーン権限を付与する初期設定。権限設計と登録対象の確認が必要となる。"

  observability:
    description: "Container Apps のログ収集と稼働確認に必要な初期リソース。"
    resources:
      - name: "Log Analytics Workspace"
        azure_resource_type: "Microsoft.OperationalInsights/workspaces"
        sku: "PerGB2018"
        unit: "ingested_GB_retained_GB"
        configuration_summary: "30-day retention"
        cost_description: "Container Apps のログ送信先として作成する。初期時点では保持期間とログ収集対象を確認する。"

  gateway_and_api_management:
    description: "公開入口および API 管理として仕様・モジュール上で計画されている周辺リソース。"
    resources:
      - name: "Application Gateway"
        azure_resource_type: "Microsoft.Network/applicationGateways"
        sku: "Standard_v2 / capacity 1"
        unit: "gateway_hour_capacity_unit_data_processed"
        status: "planned_or_module_available"
        cost_description: "Dify UI 経路の入口として計画されている。現行 main.bicep からの展開有無と SKU を見積もり前に確認する。"
      - name: "Public IP for Application Gateway"
        azure_resource_type: "Microsoft.Network/publicIPAddresses"
        sku: "Standard / Static"
        unit: "public_ip_hour"
        status: "planned_or_module_available"
        cost_description: "Application Gateway のフロントエンド IP として計画される。公開方式に応じて初期構成対象となる。"
      - name: "API Management"
        azure_resource_type: "Microsoft.ApiManagement/service"
        sku: "Consumption default / Developer planned placeholder"
        unit: "service_hour_or_api_call"
        status: "planned_or_placeholder"
        cost_description: "Dify API 経路の管理、認証、レート制限用途として計画されているが、コストと運用負荷を踏まえ保留・プレースホルダ扱い。"

  ai_integration:
    description: "Azure OpenAI 連携として仕様上計画されているリソース。"
    resources:
      - name: "Azure OpenAI account and model deployments"
        azure_resource_type: "Microsoft.CognitiveServices/accounts/deployments"
        sku: "model_deployment_sku_to_be_defined"
        unit: "token_or_provisioned_throughput_unit"
        status: "specified_but_not_currently_implemented_in_bicep"
        cost_description: "Dify から利用するモデル基盤として計画されている。現時点の Bicep 実装有無、モデル、デプロイ、リージョンを見積もり前に確定する。"

running:
  compute_and_application_platform:
    description: "Dify を継続稼働させるための Container Apps 実行コスト。"
    resources:
      - name: "Container Apps replicas"
        azure_resource_type: "Microsoft.App/containerApps"
        sku: "Consumption / replica resources per component"
        unit: "vCPU_second_and_GiB_second"
        cost_description: "各アプリの CPU、メモリ、レプリカ数、リクエスト量、スケール設定に応じて継続費用が発生する。"
      - name: "Container image execution"
        azure_resource_type: "Microsoft.App/containerApps"
        sku: "component CPU/memory from initial.compute_and_application_platform"
        unit: "replica_running_time"
        cost_description: "Dify API、Web、Worker、Sandbox、Plugin Daemon、nginx、SSRF proxy のコンテナ稼働に伴う実行費用を整理する。"
      - name: "Custom domain and certificate operations"
        azure_resource_type: "Microsoft.App/managedEnvironments/certificates"
        sku: "provided_certificate"
        unit: "certificate_renewal_operation"
        condition: "isProvidedCert=true"
        cost_description: "証明書の更新、差し替え、運用管理が必要となる。証明書取得費用は証明書発行元に応じて別途整理する。"

  data_and_storage:
    description: "データ保存、バックアップ、キャッシュ利用に伴う継続コスト。"
    resources:
      - name: "PostgreSQL Flexible Server compute"
        azure_resource_type: "Microsoft.DBforPostgreSQL/flexibleServers"
        sku: "Burstable Standard_B1ms"
        unit: "server_hour"
        cost_description: "DB サーバーの SKU、稼働時間、性能要件に応じて継続費用が発生する。"
      - name: "PostgreSQL storage and backup"
        azure_resource_type: "Microsoft.DBforPostgreSQL/flexibleServers"
        sku: "32GB storage / 7-day backup / geo-redundant backup disabled"
        unit: "storage_GB_month_and_backup_GB_month"
        cost_description: "データ容量、バックアップ保持、将来的な容量増加に応じて費用を管理する。"
      - name: "PostgreSQL databases"
        azure_resource_type: "Microsoft.DBforPostgreSQL/flexibleServers/databases"
        sku: "included_in_flexible_server"
        unit: "database_storage_growth"
        cost_description: "Dify DB と vector DB のデータ増加を PostgreSQL サーバー側の容量・性能見積もりに反映する。"
      - name: "Redis cache"
        azure_resource_type: "Microsoft.Cache/Redis"
        sku: "Basic C0"
        unit: "cache_instance_hour"
        condition: "isAcaEnabled=true"
        cost_description: "キャッシュ、キュー、セッション用途の Redis インスタンス稼働に伴う継続費用。"
      - name: "Blob Storage"
        azure_resource_type: "Microsoft.Storage/storageAccounts/blobServices"
        sku: "Standard_LRS / Hot"
        unit: "GB_month_and_operation"
        cost_description: "アップロードファイル、アプリケーション生成物、Blob 操作量、データ保持に応じた継続費用を整理する。"
      - name: "Azure Files"
        azure_resource_type: "Microsoft.Storage/storageAccounts/fileServices"
        sku: "Standard_LRS"
        unit: "GB_month_and_operation"
        cost_description: "nginx、sandbox、ssrfproxy、pluginstorage の共有ファイル容量とアクセスに伴う継続費用を整理する。"
      - name: "Storage transactions and data transfer"
        azure_resource_type: "Microsoft.Storage/storageAccounts"
        sku: "Standard_LRS"
        unit: "transaction_and_data_transfer_GB"
        cost_description: "Blob/File の読み書き、コンテナアプリからのアクセス、閉域内データ転送の利用状況を費用観点として管理する。"

  network:
    description: "閉域接続、名前解決、公開入口に伴う継続コスト。"
    resources:
      - name: "Private Endpoints"
        azure_resource_type: "Microsoft.Network/privateEndpoints"
        sku: "not_applicable"
        unit: "endpoint_hour_and_data_processed"
        cost_description: "Storage、Key Vault、Redis などへの Private Link 接続維持に伴う継続費用を整理する。"
      - name: "Private DNS Zones"
        azure_resource_type: "Microsoft.Network/privateDnsZones"
        sku: "not_applicable"
        unit: "zone_month_and_query"
        cost_description: "Private Endpoint と VNet の名前解決を維持するための DNS 管理費用を整理する。"
      - name: "Application Gateway"
        azure_resource_type: "Microsoft.Network/applicationGateways"
        sku: "Standard_v2 / capacity 1"
        unit: "gateway_hour_capacity_unit_data_processed"
        status: "planned_or_module_available"
        cost_description: "有効化する場合、ゲートウェイ稼働、キャパシティ、処理量に応じて継続費用が発生する。"
      - name: "Public IP Address"
        azure_resource_type: "Microsoft.Network/publicIPAddresses"
        sku: "Standard / Static"
        unit: "public_ip_hour"
        status: "planned_or_module_available"
        cost_description: "Application Gateway を公開入口にする場合、標準 Public IP の維持費用を整理する。"
      - name: "Outbound and cross-service data transfer"
        azure_resource_type: "network_data_transfer"
        sku: "region_and_path_dependent"
        unit: "data_transfer_GB"
        cost_description: "Container Apps、Storage、DB、外部 API、Azure OpenAI などの通信経路に応じてデータ転送費用を確認する。"

  security_and_secret_management:
    description: "機密情報保管、参照、アクセス制御に伴う継続コスト。"
    resources:
      - name: "Key Vault operations"
        azure_resource_type: "Microsoft.KeyVault/vaults"
        sku: "Standard"
        unit: "operation"
        cost_description: "シークレット、証明書、キーの保存と取得操作に応じて継続費用が発生する。"
      - name: "Secret and certificate lifecycle"
        azure_resource_type: "Microsoft.KeyVault/vaults/secrets"
        sku: "Standard vault objects"
        unit: "secret_certificate_version_and_operation"
        cost_description: "AOAI API Key、DB パスワード、証明書などのローテーションや監査を運用コスト観点として整理する。"

  observability:
    description: "ログ収集、保持、監視運用に伴う継続コスト。"
    resources:
      - name: "Log Analytics ingestion"
        azure_resource_type: "Microsoft.OperationalInsights/workspaces"
        sku: "PerGB2018"
        unit: "ingested_GB"
        cost_description: "Container Apps から送信されるログ量に応じた取り込み費用を管理する。"
      - name: "Log Analytics retention"
        azure_resource_type: "Microsoft.OperationalInsights/workspaces"
        sku: "PerGB2018 / 30-day retention"
        unit: "retained_GB"
        cost_description: "保持期間とログ量に応じた保存費用を整理する。"

  gateway_and_api_management:
    description: "API 公開、認証、レート制限を有効化した場合の継続コスト。"
    resources:
      - name: "API Management"
        azure_resource_type: "Microsoft.ApiManagement/service"
        sku: "Consumption default / Developer planned placeholder"
        unit: "service_hour_or_api_call"
        status: "planned_or_placeholder"
        cost_description: "有効化する場合、SKU、稼働時間、API 呼び出し、ポリシー運用に応じた継続費用を整理する。"
      - name: "OAuth2 Proxy or authentication middleware"
        azure_resource_type: "application_component"
        sku: "deployment_target_to_be_defined"
        unit: "compute_runtime_and_log_volume"
        status: "planned_in_spec"
        cost_description: "App Gateway 経路で認証補助を導入する場合、実行基盤、ログ、運用管理の継続費用を整理する。"

  ai_integration:
    description: "Dify から利用する Azure OpenAI 連携に伴う継続コスト。"
    resources:
      - name: "Azure OpenAI model usage"
        azure_resource_type: "Microsoft.CognitiveServices/accounts/deployments"
        sku: "model_deployment_sku_to_be_defined"
        unit: "token_or_provisioned_throughput_unit"
        status: "specified_but_not_currently_implemented_in_bicep"
        cost_description: "モデルデプロイ、トークン利用、スループット、リージョン、クォータに応じた費用を別途見積もる。"
      - name: "Azure OpenAI secrets in Key Vault"
        azure_resource_type: "Microsoft.KeyVault/vaults/secrets"
        sku: "Standard vault objects"
        unit: "secret_operation"
        status: "planned_in_spec"
        cost_description: "API Key を Key Vault で保管・参照する場合、Key Vault のシークレット操作費用と運用を整理する。"
